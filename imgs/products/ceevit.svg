<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="orange1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="20" fill="url(#bg3)"/>
  <!-- Vitamin bottle shape -->
  <rect x="110" y="70" width="100" height="115" rx="14" fill="url(#orange1)" filter="url(#shadow3)"/>
  <!-- Bottle cap -->
  <rect x="118" y="50" width="84" height="28" rx="10" fill="#92400E"/>
  <!-- Bottle highlight -->
  <rect x="120" y="78" width="18" height="60" rx="8" fill="rgba(255,255,255,0.18)"/>
  <!-- Label on bottle -->
  <rect x="118" y="100" width="84" height="60" rx="4" fill="rgba(255,255,255,0.92)"/>
  <text x="160" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="13" fill="#92400E">VITAMIN C</text>
  <text x="160" y="134" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="16" fill="#D97706">250 mg</text>
  <text x="160" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748B">Chewable Tablets</text>
  <!-- Orange slice decoration -->
  <circle cx="80" cy="90" r="28" fill="#FDE68A"/>
  <circle cx="80" cy="90" r="20" fill="#F59E0B"/>
  <path d="M80 70 L80 110 M60 90 L100 90 M65 75 L95 105 M95 75 L65 105" stroke="#FDE68A" stroke-width="2"/>
  <circle cx="80" cy="90" r="6" fill="#FDE68A"/>
  <!-- Decorative circles -->
  <circle cx="240" cy="160" r="22" fill="#FEF3C7"/>
  <circle cx="248" cy="152" r="14" fill="#FDE68A"/>
  <!-- Price -->
  <rect x="110" y="200" width="100" height="24" rx="12" fill="#D97706"/>
  <text x="160" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="12" fill="white">à§³18.00 / bottle</text>
</svg>

