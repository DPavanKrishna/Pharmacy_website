<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="cap1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cap2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="20" fill="url(#bg2)"/>
  <!-- Blister pack body -->
  <rect x="60" y="55" width="200" height="120" rx="10" fill="white" filter="url(#shadow2)"/>
  <rect x="60" y="55" width="200" height="35" rx="10" fill="url(#cap1)"/>
  <rect x="60" y="78" width="200" height="12" fill="url(#cap1)"/>
  <!-- Capsule icons in blister -->
  <g transform="translate(85,115) rotate(-20)">
    <rect x="0" y="0" width="14" height="38" rx="7" fill="url(#cap1)"/>
    <rect x="0" y="19" width="14" height="19" rx="7" fill="url(#cap2)"/>
  </g>
  <g transform="translate(118,108) rotate(-20)">
    <rect x="0" y="0" width="14" height="38" rx="7" fill="url(#cap1)"/>
    <rect x="0" y="19" width="14" height="19" rx="7" fill="url(#cap2)"/>
  </g>
  <g transform="translate(151,113) rotate(-20)">
    <rect x="0" y="0" width="14" height="38" rx="7" fill="url(#cap1)"/>
    <rect x="0" y="19" width="14" height="19" rx="7" fill="url(#cap2)"/>
  </g>
  <g transform="translate(184,108) rotate(-20)">
    <rect x="0" y="0" width="14" height="38" rx="7" fill="url(#cap1)"/>
    <rect x="0" y="19" width="14" height="19" rx="7" fill="url(#cap2)"/>
  </g>
  <!-- Header text -->
  <text x="160" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="12" fill="white" letter-spacing="1">HEALTHCARE PHARMA</text>
  <text x="160" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="17" fill="#1E40AF">SERGEL 20mg</text>
  <text x="160" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-weight="500" font-size="10" fill="#64748B">Esomeprazole Capsule</text>
  <!-- Rx badge -->
  <rect x="126" y="195" width="68" height="22" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="160" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="10" fill="#1E40AF">Rx Required</text>
</svg>

